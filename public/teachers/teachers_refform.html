<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Registration</title>
    <link rel="stylesheet" href="teachersform.css" />
  </head>

  <body>
    <div class="page-container">
      <div class="form-header">
        <h1>Teacher Registration</h1>
        <p>Register a new teacher into the school management system.</p>
      </div>

      <form class="teacher-form" id="teacherForm">
        <!-- Personal Information -->
        <section class="form-section">
          <h2>Personal Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Enter first name"
                required
              />
            </div>

            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter last name"
                required
              />
            </div>

            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
              </select>
            </div>

            <div class="form-group">
              <label for="dateOfBirth">Date of Birth</label>
              <input type="date" id="dateOfBirth" name="dateOfBirth" required />
            </div>

            <div class="form-group">
              <label for="nationality">Nationality</label>
              <input
                type="text"
                id="nationality"
                name="nationality"
                placeholder="Enter nationality"
              />
            </div>

            <div class="form-group">
              <label for="photo">Profile Photo</label>
              <input type="file" id="photo" name="photo" accept="image/*" />
            </div>
          </div>
        </section>

        <!-- Contact Information -->
        <section class="form-section">
          <h2>Contact Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
              />
            </div>

            <div class="form-group full-width">
              <label for="address">Address</label>
              <textarea
                id="address"
                name="address"
                placeholder="Enter residential address"
              ></textarea>
            </div>
          </div>
        </section>

        <!-- Employment Information -->
        <section class="form-section">
          <h2>Employment Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="staffId">Staff ID</label>
              <input
                type="text"
                id="staffId"
                name="staffId"
                placeholder="Enter staff ID"
                required
              />
            </div>

            <div class="form-group">
              <label for="employmentDate">Date of Employment</label>
              <input type="date" id="employmentDate" name="employmentDate" />
            </div>

            <div class="form-group">
              <label for="department">Department</label>
              <select id="department" name="department">
                <option value="">Select department</option>
                <option value="sciences">Sciences</option>
                <option value="humanities">Humanities</option>
                <option value="languages">Languages</option>
                <option value="mathematics">Mathematics</option>
                <option value="ict">ICT</option>
              </select>
            </div>

            <div class="form-group">
              <label for="position">Position</label>
              <select id="position" name="position">
                <option value="">Select position</option>
                <option value="teacher">Teacher</option>
                <option value="senior-teacher">Senior Teacher</option>
                <option value="head-of-department">Head of Department</option>
                <option value="deputy-head">Deputy Head Teacher</option>
              </select>
            </div>

            <div class="form-group">
              <label for="qualification">Highest Qualification</label>
              <input
                type="text"
                id="qualification"
                name="qualification"
                placeholder="e.g. Bachelor's Degree"
              />
            </div>

            <div class="form-group">
              <label for="specialization">Specialization</label>
              <input
                type="text"
                id="specialization"
                name="specialization"
                placeholder="e.g. Mathematics"
              />
            </div>
          </div>
        </section>

        <!-- Account Information -->
        <section class="form-section">
          <h2>Account Information</h2>

          <div class="form-grid">
            <div class="form-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Create username"
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
              />
            </div>
          </div>
        </section>

        <!-- Buttons -->
        <div class="form-actions">
          <button type="reset" class="btn btn-secondary">Clear</button>

          <button type="submit" class="btn btn-primary">
            Register Teacher
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
