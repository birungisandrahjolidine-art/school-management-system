<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - School Management System</title>

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main class="login-container">
      <div class="login-card">
        <div class="logo">
          <h2>School MS</h2>
          <p>Management System</p>
        </div>

        <div class="icon">🔐</div>

        <h1>Sign In</h1>
        <p class="subtitle">Access your school management account</p>

        <form id="loginForm">
          <!-- ROLE -->
          <div class="form-group">
            <label for="role">Select Role</label>
            <select id="role" required>
              <option value="">-- Select Role --</option>
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
              <option value="librarian">Librarian</option>
              <option value="admin">Admin</option>
              <option value="bursar">Bursar</option>
            </select>
          </div>

          <!-- USERNAME / ID -->
          <div class="form-group">
            <label for="username">Username / Staff ID</label>
            <input type="text" id="username" placeholder="Enter your username or ID" required />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" id="rememberMe" /> Remember me
            </label>

            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login">Sign In</button>

          <div class="redirect-notice" id="redirectNotice"></div>
        </form>
      </div>
    </main>

    <script src="login.js"></script>
  </body>
</html>
