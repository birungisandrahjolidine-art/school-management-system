  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h1>Settings</h1>
        <p>Manage your profile and preferences</p>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search here..." />
      </div>

      <div class="topbar-right">
        <a class="icon-btn" href="announcements.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>

        <a class="user-chip" href="settings.html">
          <div class="avatar">MR</div>
          <div>
            <div class="name">Mithun Ray</div>
            <div class="role">Student</div>
          </div>
        </a>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span>Profile Settings</span></div>
      <div class="card-body">
        <form id="profileForm">
          <div class="form-grid">
            <div class="field">
              <label>First Name</label>
              <input type="text" id="pFirst" value="Mithun" />
            </div>
            <div class="field">
              <label>Last Name</label>
              <input type="text" id="pLast" value="Ray" />
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" id="pEmail" value="mithun.ray@akademi.edu" />
            </div>
            <div class="field">
              <label>Phone</label>
              <input type="text" id="pPhone" value="+1 234 555 0199" />
            </div>
            <div class="field">
              <label>Class</label>
              <input type="text" id="pClass" value="Grade 8 - A" />
            </div>
            <div class="field">
              <label>Notifications</label>
              <select id="pNotif">
                <option>All notifications</option>
                <option>Important only</option>
                <option>None</option>
              </select>
            </div>
          </div>
          <div class="btn-row">
            <button type="button" class="btn" id="cancelProfile">Cancel</button>
            <button type="submit" class="btn primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script>
  function toast(msg, type){
    const icon = type === "success"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>';
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.innerHTML = icon + "<span>" + msg + "</span>";
    document.getElementById("toastWrap").appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  const defaults = { first:"Mithun", last:"Ray", phone:"+1 234 555 0199", cls:"Grade 8 - A", email:"mithun.ray@akademi.edu" };

  document.getElementById("profileForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = {
      first: document.getElementById("pFirst").value.trim(),
      last: document.getElementById("pLast").value.trim(),
      cls: document.getElementById("pClass").value.trim()
    };
    toast("Profile saved for " + data.first + " " + data.last + " (" + data.cls + ")", "success");
  });

  document.getElementById("cancelProfile").addEventListener("click", () => {
    document.getElementById("pFirst").value = defaults.first;
    document.getElementById("pLast").value = defaults.last;
    document.getElementById("pPhone").value = defaults.phone;
    document.getElementById("pClass").value = defaults.cls;
    document.getElementById("pEmail").value = defaults.email;
    document.getElementById("pNotif").selectedIndex = 0;
    toast("Changes discarded");
  });
</script>

</body>
