<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akademi | Sign In</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">A</div>
      <div>
        <h1>Akademi</h1>
        <p>School Management System</p>
      </div>
    </div>

    <h2>Sign in</h2>
    <p class="auth-sub">Select your role to continue to your workspace.</p>

    <form id="loginForm">
      <div class="role-grid" id="roleGrid">
        <label class="role-option" for="role-teacher">
          <input type="radio" name="role" id="role-teacher" value="teacher" />
          <span class="role-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg></span>
          <span><span class="r-name">Class Teacher</span><br /><span class="r-desc">Manage students, attendance &amp; reports for your class</span></span>
        </label>
        <label class="role-option" for="role-librarian">
          <input type="radio" name="role" id="role-librarian" value="librarian" />
          <span class="role-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg></span>
          <span><span class="r-name">Librarian</span><br /><span class="r-desc">Manage the library: books, borrowing &amp; returns</span></span>
        </label>
        <label class="role-option" for="role-staff">
          <input type="radio" name="role" id="role-staff" value="staff" />
          <span class="role-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg></span>
          <span><span class="r-name">Management / Admin</span><br /><span class="r-desc">School-wide overview &amp; admin (coming soon)</span></span>
        </label>
      </div>

      <button type="submit" class="btn primary" style="width:100%; justify-content:center;">Continue</button>
    </form>

    <div class="auth-note"><strong>Team note:</strong> This login is a placeholder. Real authentication &amp; role-based access will be wired to the backend after the GitHub merge. Select a role to preview the relevant area.</div>
  </div>
</div>

<script>
  const roleHome = {
    teacher: "dashboard.html",
    librarian: "library.html",
    staff: "dashboard.html"
  };

  function selectCard(label){
    document.querySelectorAll(".role-option").forEach(o => o.classList.remove("selected"));
    label.classList.add("selected");
  }
  document.querySelectorAll('.role-option input[name="role"]').forEach(r => {
    r.addEventListener("change", () => selectCard(r.closest(".role-option")));
  });
  document.querySelectorAll(".role-option").forEach(o => {
    o.addEventListener("click", () => {
      const input = o.querySelector('input[name="role"]');
      input.checked = true;
      selectCard(o);
    });
  });

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const selected = document.querySelector('input[name="role"]:checked');
    if (!selected){ alert("Please select your role to continue."); return; }
    const role = selected.value;
    try { localStorage.setItem("akademi_role", role); } catch(err){}
    window.location.href = roleHome[role];
  });
</script>
</body>
</html>
